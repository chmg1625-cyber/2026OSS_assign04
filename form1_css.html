<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>폼나는css폼1</title>
    <style>
        body {
            background-color: #f7f9fb;
            color: #333333;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 700px;
            margin: 0 auto;
            background-color: #ffffff;
            border: 1px solid #d3d9de;
            border-radius: 8px;
            padding: 25px 35px;
        }

        fieldset {
            border: 1px solid #c9d5e0;
            border-radius: 6px;
            padding: 15px 20px;
            margin-bottom: 20px;
            background-color: #fafbfc;
        }

        legend {
            font-weight: bold;
            color: #1e4f8a;
            padding: 0 8px;
            font-size: 14px;
        }

        .form-row {
            margin-bottom: 12px;
        }

        label {
            display: inline-block;
            width: 130px;
            font-size: 13px;
            color: #444444;
            font-weight: 500;
        }

        .inline-label {
            width: auto;
            margin-right: 15px;
        }


        input[type="text"] {
            width: 320px;
            padding: 7px 10px;
            border: 1px solid #bcc7d2;
            border-radius: 4px;
            font-size: 13px;
            background-color: #ffffff;
        }

        input[type="password"] {
            width: 320px;
            padding: 7px 10px;
            border: 1px solid #bcc7d2;
            border-radius: 4px;
            font-size: 13px;

            background-color: #ffffff;
        }

        input[type="date"] {
            width: 320px;
            padding: 7px 10px;
            border: 1px solid #bcc7d2;
            border-radius: 4px;
            font-size: 13px;

            background-color: #ffffff;
        }

        select {
            width: 320px;
            padding: 7px 10px;
            border: 1px solid #bcc7d2;
            border-radius: 4px;
            font-size: 13px;

            background-color: #ffffff;
        }

        textarea {
            width: 320px;
            padding: 7px 10px;
            border: 1px solid #bcc7d2;
            border-radius: 4px;
            font-size: 13px;
            background-color: #ffffff;
            width: 95%;
            height: 80px;
            resize: vertical;
            display: flex;
            margin-top: 6px;
        }

        .button-area {
            text-align: center;
            margin-top: 25px;
        }

        input[type="submit"] {
            padding: 9px 24px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            margin: 0 5px;
            display: inline-block;
        }

        input[type="reset"] {
            padding: 9px 24px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            margin: 0 5px;
            display: inline-block;
        }

        input[type="submit"] {
            background-color: #2b72c4;
            color: #ffffff;
            border: 1px solid #1f5697;
        }

        input[type="reset"] {
            background-color: #e9ecef;
            color: #495057;
            border: 1px solid #ced4da;
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <h1>히즈넷개량을해본다면 두둥</h1>
        </header>

        <form action="#" method="post">

            <fieldset>
                <legend>로그인 정보</legend>

                <div class="form-row">
                    <span style="display: inline-block; width: 130px; font-size: 13px;">언어 선택:</span>
                    <input type="radio" id="lang_ko" name="lang" value="ko" checked>
                    <label for="lang_ko" class="inline-label">한글</label>
                    <input type="radio" id="lang_en" name="lang" value="en">
                    <label for="lang_en" class="inline-label">English</label>
                </div>

                <div class="form-row">
                    <label for="user_id">아이디:</label>
                    <input type="text" id="user_id" name="user_id" placeholder="학번 입력" required>
                </div>

                <div class="form-row">
                    <label for="user_pw">비밀번호:</label>
                    <input type="password" id="user_pw" name="user_pw" minlength="8" maxlength="12"
                        placeholder="비밀번호 입력" required>
                    <p style="font-size: 10px; color:red">*최소 8자 이상, 최대 12글자 이하</p>
                </div>

                <div class="form-row">
                    <input type="checkbox" id="save_id" name="save_id" value="yes">
                    <label for="save_id" class="inline-label">아이디 저장</label>
                </div>
            </fieldset>

            <fieldset>
                <legend>학사 추가 정보 및 신청서</legend>

                <div class="form-row">
                    <label for="user_name">이름:</label>
                    <input type="text" id="user_name" name="user_name" placeholder="이름을 입력하세요">
                </div>

                <div class="form-row">
                    <label for="birth_date">생년월일:</label>
                    <input type="date" id="birth_date" name="birth_date">
                </div>

                <div class="form-row">
                    <label for="department">소속 학부:</label>
                    <select id="department" name="department">
                        <option value="">-- 학부 선택 --</option>
                        <option value="a1">AI컴퓨터전자공학부</option>
                        <option value="a2">글로벌리더십학부</option>
                        <option value="a3">경영경제학부</option>
                        <option value="a4">커뮤니케이션학부</option>
                        <option value="a5">상담심리사회복지학부</option>
                        <option value="a6">법학부</option>
                        <option value="a7">Ai융합학부</option>
                        <option value="a8">생명과학부</option>
                        <option value="a9">기계제어공학부</option>
                        <option value="a10">공간환경시스템공학부</option>
                        <option value="a11">콘텐츠융합디자인학부</option>
                        <option value="a12">국제어문학부</option>
                    </select>
                </div>

                <div class="form-row">
                    <span style="display: inline-block; width: 130px; font-size: 13px;">알림 수신 여부:</span>
                    <input type="checkbox" id="notify_email" name="notification" value="email">
                    <label for="notify_email" class="inline-label">이메일 알림</label>
                    <input type="checkbox" id="notify_sms" name="notification" value="sms">
                    <label for="notify_sms" class="inline-label">SMS 알림</label>
                </div>

                <div class="form-row">
                    <label for="feedback" style="width: auto;">문의 및 건의사항:</label>
                    <textarea id="feedback" name="feedback" placeholder="의견을 남겨주세요."></textarea>
                </div>
            </fieldset>

            <div class="button-area">
                <input type="submit" value="로그인 및 제출">
                <input type="reset" value="초기화">
            </div>
        </form>
    </div>

</body>

</html>
